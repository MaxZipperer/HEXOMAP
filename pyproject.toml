[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hexomap"
version = "0.4"
description = "High Energy X-ray Orientation Mapping"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "docopt>=0.6.2",
    "matplotlib>=3.8.0",
    "numba>=0.60.0",
    "numpy>=1.26.0",
    "pycuda>=2024.1",
    "scipy>=1.11.0",
    "tqdm>=4.31.1",
    "PyYAML>=6.0",
    "h5py>=3.10.0",
    "opencv-python>=4.8.0",
    "tifffile>=2023.0.0",
    "mpi4py>=3.1.0",
]

[tool.setuptools]
packages = ["hexomap"]

[tool.setuptools.package-data]
hexomap = [
    "data/fundamental_zone/*",
    "data/materials/*",
    "kernel_cuda/*",
]
